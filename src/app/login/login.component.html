<div class="login-container">
  <div class="login-card">
    <div class="logo-circle">
      <span>HUB</span>
    </div>
    <h1>Welcome to HBCU HUB</h1>
    <p>Connect with your HBCU community</p>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <label for="username">Email</label>
      <div class="email-combined-wrapper">
        <input
          type="text"
          id="username"
          formControlName="username"
          placeholder="first.last"
          class="email-name-input"
        />
        <select formControlName="domain" class="email-domain-select">
          <option *ngFor="let domain of hbcuDomains" [value]="domain">{{ domain }}</option>
        </select>
      </div>
      <div *ngIf="loginForm.get('username')?.invalid && loginForm.get('username')?.touched" class="error-message">
        Please use format: first.last
      </div>

      <label for="password">Password</label>
      <input
        type="password"
        id="password"
        formControlName="password"
        placeholder="Enter your password"
      />
      <div *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched" class="error-message">
        Password is required
      </div>

      <button type="submit" class="login-button" [disabled]="isLoading || loginForm.invalid">
        {{ isLoading ? 'Logging in...' : 'Login' }}
      </button>

      <div *ngIf="errorMessage" class="error-message">{{ errorMessage }}</div>
    </form>

    <p class="signup-link">
      Don’t have an account? <a [routerLink]="['/signup']">Join the family</a>
    </p>
  </div>
</div>
