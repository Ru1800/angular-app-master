<div class="signup-container">
    <div class="signup-card">
      <h2>Create an Account</h2>
      
      <form [formGroup]="signupForm" (ngSubmit)="onSubmit()">
        <div class="form-group">
          <label for="name">Full Name</label>
          <input 
            type="text" 
            id="name" 
            formControlName="name" 
            placeholder="Enter your full name">
          <div *ngIf="signupForm.get('name')?.touched && signupForm.get('name')?.invalid" class="error-message">
            <span *ngIf="signupForm.get('name')?.errors?.['required']">Name is required</span>
          </div>
        </div>
        
        <div class="form-group">
          <label for="email">Email</label>
          <input 
            type="email" 
            id="email" 
            formControlName="email" 
            placeholder="Enter your email">
          <div *ngIf="signupForm.get('email')?.touched && signupForm.get('email')?.invalid" class="error-message">
            <span *ngIf="signupForm.get('email')?.errors?.['required']">Email is required</span>
            <span *ngIf="signupForm.get('email')?.errors?.['email']">Please enter a valid email</span>
          </div>
        </div>
        
        <div class="form-group">
          <label for="password">Password</label>
          <input 
            type="password" 
            id="password" 
            formControlName="password" 
            placeholder="Create a password">
          <div *ngIf="signupForm.get('password')?.touched && signupForm.get('password')?.invalid" class="error-message">
            <span *ngIf="signupForm.get('password')?.errors?.['required']">Password is required</span>
            <span *ngIf="signupForm.get('password')?.errors?.['minlength']">Password must be at least 6 characters</span>
          </div>
        </div>
        
        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>
          <input 
            type="password" 
            id="confirmPassword" 
            formControlName="confirmPassword" 
            placeholder="Confirm your password">
          <div *ngIf="signupForm.get('confirmPassword')?.touched && signupForm.get('confirmPassword')?.invalid" class="error-message">
            <span *ngIf="signupForm.get('confirmPassword')?.errors?.['required']">Please confirm your password</span>
            <span *ngIf="signupForm.get('confirmPassword')?.errors?.['passwordMismatch']">Passwords do not match</span>
          </div>
        </div>
        
        <div *ngIf="errorMessage" class="error-message">
          {{ errorMessage }}
        </div>
        
        <button type="submit" [disabled]="signupForm.invalid || isLoading" class="signup-button">
          <span *ngIf="!isLoading">Create Account</span>
          <span *ngIf="isLoading">Creating account...</span>
        </button>
      </form>
      
      <div class="login-link">
        Already have an account? <a [routerLink]="['/login']">Log in</a>
      </div>
    </div>
  </div>
